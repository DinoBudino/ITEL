model_id: multilingual-cz-en
prediction_unit: subject
languages: [cs, en]
preprocessing:
  sample_rate: 16000
  highpass_hz: 100
  target_rms: 0.08
  max_peak: 0.99
  min_duration_seconds: 0.3
encoder:
  bundle: HUBERT_BASE
  layer_policy: last
features:
  recipe: hubert-base-last-temporal-stats-v1
  aggregation: subject_mean
adaptation: centroid_shift
classifier: logreg_pca
threshold_source: loso_out_of_fold
