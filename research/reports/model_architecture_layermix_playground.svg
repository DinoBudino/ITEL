<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</title><desc id="desc">Architecture diagram for the LayerMix final model.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">LayerMix Architecture - Playground</text><text x="40" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</text><line x1="40" y1="92" x2="1560" y2="92" stroke="#dbe4f0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/><circle cx="160" cy="300" r="24" fill="#ffffff" stroke="#111111" stroke-width="4" opacity="1.0"/><circle cx="160" cy="300" r="15" fill="#111111" stroke="#111111" stroke-width="1" opacity="0.14"/><text x="160" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Audio</text><circle cx="160" cy="388" r="24" fill="#ffffff" stroke="#2f2f2f" stroke-width="4" opacity="1.0"/><circle cx="160" cy="388" r="15" fill="#2f2f2f" stroke="#2f2f2f" stroke-width="1" opacity="0.14"/><text x="160" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Wave</text><circle cx="160" cy="476" r="24" fill="#ffffff" stroke="#5a5a5a" stroke-width="4" opacity="1.0"/><circle cx="160" cy="476" r="15" fill="#5a5a5a" stroke="#5a5a5a" stroke-width="1" opacity="0.14"/><text x="160" y="524" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Frames</text><circle cx="430" cy="220" r="24" fill="#ffffff" stroke="#111111" stroke-width="4" opacity="1.0"/><circle cx="430" cy="220" r="15" fill="#111111" stro