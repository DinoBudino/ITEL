 300, 1056 300" fill="none" stroke="#5f5f5f" stroke-width="2.8" stroke-linecap="round" opacity="0.44"/><path d="M 784 348 C 904.0 348, 936.0 388, 1056 388" fill="none" stroke="#d4d4d4" stroke-width="1.2" stroke-linecap="round" opacity="0.62"/><path d="M 784 348 C 904.0 348, 936.0 476, 1056 476" fill="none" stroke="#b8b8b8" stroke-width="2.0" stroke-linecap="round" opacity="0.26"/><path d="M 784 436 C 904.0 436, 936.0 300, 1056 300" fill="none" stroke="#d4d4d4" stroke-width="2.0" stroke-linecap="round" opacity="0.62"/><path d="M 784 436 C 904.0 436, 936.0 388, 1056 388" fill="none" stroke="#b8b8b8" stroke-width="2.8" stroke-linecap="round" opacity="0.26"/><path d="M 784 436 C 904.0 436, 936.0 476, 1056 476" fill="none" stroke="#8f8f8f" stroke-width="1.2" stroke-linecap="round" opacity="0.44"/><path d="M 784 524 C 904.0 524, 936.0 300, 1056 300" fill="none" stroke="#b8b8b8" stroke-width="1.2" stroke-linecap="round" opacity="0.26"/><path d="M 784 524 C 904.0 524, 936.0 388, 1056 388" fill="none" stroke="#8f8f8f" stroke-width="2.0" stroke-linecap="round" opacity="0.44"/><path d="M 784 524 C 904.0 524, 936.0 476, 1056 476" fill="none" stroke="#5f5f5f" stroke-width="2.8" stroke-linecap="round" opacity="0.62"/><path d="M 1104 300 C 1219.5 300, 1250.5 340, 1366 340" fill="none" stroke="#5f5f5f" stroke-width="1.2" stroke-linecap="round" opacity="0.26"/><path d="M 1104 300 C 1219.5 300, 1250.5 428, 1366 428" fill="none" stroke="#d4d4d4" stroke-width="2.0" stroke-linecap="round" opacity="0.44"/><path d="M 1104 388 C 1219.5 388, 1250.5 340, 1366 340" fill="none" stroke="#d4d4d4" stroke-width="2.8" stroke-linecap="round" opacity="0.44"/><path d="M 1104 388 C 1219.5 388, 1250.5 428, 1366 428" fill="none" stroke="#b8b8b8" stroke-width="1.2" stroke-linecap="round" opacity="0.62"/><path d="M 1104 476 C 1219.5 476, 1250.5 340, 1366 340" fill="none" stroke="#b8b8b8" stroke-width="2.0" stroke-linecap="round" opacity="0.62"/><path d="M 1104 476 C 1219.5 476, 1250.5 428, 1366 428" fill="none" stroke="#8f8f8f" stroke-width="2.8" stroke-linecap="round" opacity="0.26"/><text x="160" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">INPUT</text><text x="430" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">ENCODER + LAYER MIX</text><text x="760" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">SEQUENCE MODEL</text><text x="1080" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">CLASSIFIER</text><text x="1390" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">OUTPUT</text><text x="70" y="664" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Model signals</text><text x="70" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">HuBERT_BASE emits sequential embeddings with shape T x 768.</text><text x="70" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">ScalarMix learns a weighted combination over the 12 transformer layers.</text><text x="70" y="756" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">BiLSTM uses 2 layers with hidden size 256 per direction.</text><text x="70" y="784" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Attention compresses time into a 512-dimensional context vector.</text><text x="70" y="812" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Final head maps 512 -&gt; 128 -&gt; 1, then sigmoid scores Patients probability.</text><rect x="1110" y="630" width="420" height="210" rx="28" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5" opacity="1.0"/><text x="1140" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Hyperparameters</text><text x="1140" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">dropout=0.3</text><text x="1140" y="744" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">fc_hidden=128</text><text x="1140" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">epochs=30</text><text x="1320" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">lr=0.001</text><text x="1320" y="744" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">weight_decay=0.0001</text><text x="1320" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">pos_weight=1.4</text><text x="70" y="850" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Legend: T = number of time frames extracted from the input audio.</text></svg>