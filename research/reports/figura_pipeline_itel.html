<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ITEL Pipeline — Figura de Tesis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',Arial,sans-serif; padding:20px; }
  .instructions {
    background:#f0f4f8; border:1px solid #cbd5e0; border-radius:8px;
    padding:12px 20px; margin-bottom:20px; font-size:0.82rem; color:#555;
    max-width:1200px; width:100%; line-height:1.6;
  }
  .instructions strong { color:#1a1a2e; }
  svg { max-width:100%; height:auto; }
  @media print { .instructions { display:none; } body { padding:0; } }
</style>
</head>
<body>

<div class="instructions">
  <strong>Para exportar como imagen de tesis:</strong>
  Haz clic derecho sobre el diagrama → "Guardar imagen como..." (si usas Chrome/Edge)
  · O usa <strong>Ctrl+P → Guardar como PDF</strong> para máxima calidad.
  · También puedes hacer una captura de pantalla del SVG directamente.
</div>

<svg viewBox="0 0 1270 510" width="1270" height="510" xmlns="http://www.w3.org/2000/svg"
     style="border:1px solid #e8e8e8; background:#ffffff; border-radius:4px;">

  <!-- ═══════════════════════════════════════════════ DEFS ═════════════════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#aaa"/>
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <!-- dashed connector style used between stages -->
    <style>
      .lbl { font-family:'Segoe UI',Arial,sans-serif; }
      .stage-title { font-size:11px; font-weight:700; fill:#888; letter-spacing:1.2px; text-anchor:middle; }
      .node-lbl    { font-size:10px; fill:#444; text-anchor:middle; }
      .node-lbl2   { font-size:9px; fill:#666; text-anchor:middle; }

      .out-prob    { font-size:12px; font-weight:800; fill:white; text-anchor:middle; }
      .code-lbl    { font-family:'Courier New',monospace; font-size:9px; fill:#555; text-anchor:middle; }
    </style>
  </defs>

  <!-- ═══════════════════════════════════════════════ TITLE ════════════════════════════════════════════ -->
  <text x="629" y="34" font-family="'Segoe UI',Arial" font-size="18" font-weight="800" fill="#1a1a2e" text-anchor="middle">
    ITEL — Pipeline de Clasificación de Voz (TEL)
  </text>
  <text x="629" y="52" font-family="'Segoe UI',Arial" font-size="11" fill="#999" text-anchor="middle">
    WAV → Preprocesamiento → HuBERT Encoder → Embedding → Scaler → ONNX Classifier → Healthy / Patients
  </text>

  <!-- ═══════════════════════════════════════════════ STAGE LABELS ═════════════════════════════════════ -->
  <text class="stage-title" x="78"  y="78">INPUT</text>
  <text class="stage-title" x="228" y="78">PREPROCESAMIENTO</text>
  <text class="stage-title" x="438" y="78">HUBERT ENCODER</text>
  <text class="stage-title" x="680" y="78">LAYER MIX</text>
  <text class="stage-title" x="836" y="78">EMBEDDING</text>
  <text class="stage-title" x="1024" y="78">CLASIFICADOR ONNX</text>
  <text class="stage-title" x="1167" y="78">OUTPUT</text>

  <!-- ═══════════════════════════════════════ 1. INPUT WAV ══════════════════════════════════════════════ -->
  <!-- Waveform box -->
  <rect x="28" y="90" width="100" height="120" rx="6" fill="#1a1a2e" stroke="#34495e" stroke-width="1.5"/>
  <!-- waveform lines -->

  <text x="78" y="222" class="node-lbl" font-weight="700">Audio .WAV</text>
  <text x="78" y="235" class="node-lbl2">Voz del paciente</text>
  <!-- WAV label -->
  <rect x="52" y="196" width="52" height="16" rx="3" fill="#7ec8e3" opacity=".2"/>
  <text x="78" y="208" font-family="'Courier New',monospace" font-size="9" fill="#7ec8e3" text-anchor="middle" font-weight="700">.WAV  16kHz</text>

  <!-- ═══════════════════════════════════════ ARROW 1→2 ═════════════════════════════════════════════════ -->
  <line x1="132" y1="150" x2="158" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════ 2. PREPROCESSING ═════════════════════════════════════════ -->
  <rect x="162" y="90" width="130" height="120" rx="6" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- filtered signal sketch -->
  <polyline points="172,148 185,141 198,150 211,140 224,148 237,141 250,148 263,141 278,148"
            fill="none" stroke="#27ae60" stroke-width="1.6"/>
  <text x="227" y="165" font-family="'Segoe UI',Arial" font-size="9.5" fill="#2980b9" text-anchor="middle" font-weight="700">② HP Filter 100 Hz</text>
  <text x="227" y="178" font-family="'Segoe UI',Arial" font-size="9.5" fill="#2980b9" text-anchor="middle" font-weight="700">③ Normalización pico</text>
  <text x="227" y="191" font-family="'Segoe UI',Arial" font-size="9.5" fill="#2980b9" text-anchor="middle" font-weight="700">④ Pad/Trim → 2.0 s</text>
  <text x="227" y="222" class="node-lbl" font-weight="700">AudioPreprocessor</text>
  <text x="227" y="235" class="node-lbl2">scipy · librosa</text>

  <!-- ═══════════════════════════════════════ ARROW 2→3 ═════════════════════════════════════════════════ -->
  <line x1="296" y1="150" x2="320" y2="150" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Three stacked layer groups: L1-L4, L5-L8, L9-L12 -->

  <!-- L1-L4 block (leftmost) -->

  <rect x="432" y="106" width="56" height="64" rx="3" fill="#9b59b6" stroke="#bb8fce" stroke-width="1.2"/>
  <line x1="432" y1="120" x2="488" y2="120" stroke="rgba(255,255,255,.25)" stroke-width=".8"/>

  <!-- ═══════════════════════════════════════ 4. LAYER MIX ═════════════════════════════════════════════ -->
  <!-- weighted combination visualization -->
  <rect x="618" y="94" width="124" height="88" rx="5" fill="#0e6655" stroke="#1a9276" stroke-width="1.5"/>

  <text x="680" y="110" font-family="'Segoe UI',Arial" font-size="9" fill="#82e0aa" text-anchor="middle" font-weight="700">Pesos aprendibles (softmax)</text>

  <rect x="774" y="94" width="24" height="88" rx="3" fill="#1a4a3c" stroke="#27ae60" stroke-width="1.5"/>

  <line x1="774" y1="108" x2="798" y2="108" stroke="#82e0aa" stroke-width=".6" opacity=".5"/>
  <line x1="774" y1="120" x2="798" y2="120" stroke="#82e0aa" stroke-width=".6" opacity=".5"/>
