<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="980" viewBox="0 0 1640 980" role="img" aria-labelledby="title desc"><title id="title">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</title><desc id="desc">Architecture diagram for the LayerMix final model.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">LayerMix Architecture - Technical</text><text x="40" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</text><line x1="40" y1="92" x2="1600" y2="92" stroke="#dbe4f0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/><rect x="90" y="170" width="980" height="560" rx="28" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5" opacity="1.0"/><text x="120" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Tensor flow</text><rect x="130" y="260" width="170" height="86" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="1.0"/><rect x="142" y="272" width="8" height="62" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1.5" opacity="1.0"/><text x="164" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Audio</text><text x="164" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">raw waveform</text><rect x="340" y="250" width="200" height="106" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/><rect x="352" y="262" width="8" height="82" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/><text x="374" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">HuBERT_BASE</text><text x="374" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">12 layers | frame dim 768</text><rect x="590" y="250" width="170" height="106" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" opacity="1.0"/><rect x="602" y="262" width="8" height="82" rx="6" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1.5" opacity="1.0"/><text x="624" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">ScalarMix</text><text x="624" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">weighted 12-layer fusion</text><rect x="800" y="250" width="210" height="106" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" opacity="1.0"/><rect x="812" y="262" width="8" height="82" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5" opacity="1.0"/><text x="834" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Sequence tensor</text><text x="834" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">T x 768</text><rect x="275" y="450" width="260" height="118" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" opacity="1.0"/><rect x="287" y="462" width="8" height="94" rx="6" fill="#0891b2" stroke="#0891b2" stroke-width="1.5" opacity="1.0"/><text x="309" y="490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">BiLSTM 2 x 256</text><text x="309" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">bidirectional output -&gt; T x 512</text><rect x="595" y="450" width="220" height="118" rx="22" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5" opacity="1.0"/><rect x="607" y="462" width="8" height="94" rx="6" fill="#65a30d" stroke="#65a30d" stroke-width="1.5" opacity="1.0"/><text x="629" y="490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Attention</text><text x="629" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">1 head -&gt; Context 512</text><rect x="870" y="435" width="150" height="150" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" opacity="1.0"/><rect x="882" y="447" width="8" height="126" rx="6" fill="#ea580c" stroke="#ea580c" stroke-width="1.5" opacity="1.0"/><text x="904" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Classifier</text><text x="904" y="507" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">FC 512 -&gt; 128 -&gt; 1 | sigmoid</text><line x1="300" y1="303" x2="322" y2="303" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="322,295 340,303 322,311" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><line x1="540" y1="303" x2="572" y2="303" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="572,295 590,303 572,311" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><line x1="760" y1="303" x2="782" y2="303" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="782,295 800,303 782,311" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><line x1="905" y1="356" x2="905" y2="417" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="897,417 905,435 913,417" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><line x1="535" y1="509" x2="577" y2="509" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="577,501 595,509 577,517" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><line x1="815" y1="509" x2="852" y2="509" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="852,501 870,509 852,517" fill="#64748b" stroke="#64748b" stroke-width="1.5" opacity="1.0"/><text x="120" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Tensor notes</text><text x="120" y="802" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Input after HuBERT: T x 768</text><text x="120" y="830" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">BiLSTM hidden state per time step: T x 512</text><text x="120" y="858" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Attention reduces temporal axis T -&gt; Context 512</text><text x="120" y="886" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Final classifier emits one logit; sigmoid converts it to P(Patients)</text><rect x="1120" y="170" width="450" height="730" rx="28" fill="#ffffff" stroke="#d7e0ea" stroke-width="1.5" opacity="1.0"/><text x="1150" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Metadata and training</text><text x="1150" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">arch: V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon</text><text x="1150" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">tag: v3_layermix</text><text x="1150" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">source_manifest: research/processed_data/manifests/hubert_sequences_all_layers.csv</text><text x="1150" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">layer_mix: True</text><text x="1150" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">embedding_noise_std: 0.0</text><text x="1150" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">attention_entropy_lambda: 0.0</text><text x="1150" y="416" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Model config</text><text x="1150" y="444" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">input_dim=768</text><text x="1150" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">lstm_hidden=256</text><text x="1150" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">lstm_layers=2</text><text x="1150" y="516" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">num_heads=1</text><text x="1150" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">dropout=0.3</text><text x="1150" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">fc_hidden=128</text><text x="1150" y="606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Preprocessing</text><text x="1150" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">target_sr=16000</text><text x="1150" y="658" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">highpass_hz=100</text><text x="1150" y="682" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">target_rms=0.08</text><text x="1150" y="706" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">profile=multilingual_light</text><text x="1150" y="748" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Training config</text><text x="1150" y="776" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">epochs=30</text><text x="1150" y="800" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">lr=0.001</text><text x="1150" y="824" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">weight_decay=0.0001</text><text x="1150" y="848" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">pos_weight=1.4</text><text x="1150" y="876" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Legend: T = number of valid HuBERT time frames for one audio sample.</text></svg>