<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc"><title id="title">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</title><desc id="desc">Architecture diagram for the LayerMix final model.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">LayerMix Architecture - Schematic</text><text x="40" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">V3_HuBERT_BASE -&gt; AttentionBiLSTM + SupCon (LayerMix)</text><line x1="40" y1="92" x2="1560" y2="92" stroke="#dbe4f0" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/><rect x="40" y="230" width="210" height="108" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" opacity="1.0"/><rect x="52" y="242" width="8" height="84" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1.5" opacity="1.0"/><text x="74" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Audio</text><text x="74" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">16 kHz WAV | HP 100 Hz</text><line x1="258" y1="284.0" x2="262" y2="284.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="262,276.0 280,284.0 262,292.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><rect x="280" y="230" width="210" height="108" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/><rect x="292" y="242" width="8" height="84" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/><text x="314" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">HuBERT_BASE</text><text x="314" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Frozen encoder | per-frame 768D</text><line x1="498" y1="284.0" x2="502" y2="284.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="502,276.0 520,284.0 502,292.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><rect x="520" y="230" width="210" height="108" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" opacity="1.0"/><rect x="532" y="242" width="8" height="84" rx="6" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1.5" opacity="1.0"/><text x="554" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">ScalarMix</text><text x="554" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">12 layers -&gt; weighted layer fusion</text><line x1="738" y1="284.0" x2="742" y2="284.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="742,276.0 760,284.0 742,292.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><rect x="760" y="230" width="210" height="108" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" opacity="1.0"/><rect x="772" y="242" width="8" height="84" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5" opacity="1.0"/><text x="794" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Sequence</text><text x="794" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">T x 768</text><line x1="978" y1="284.0" x2="982" y2="284.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="982,276.0 1000,284.0 982,292.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><rect x="1000" y="230" width="210" height="108" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" opacity="1.0"/><rect x="1012" y="242" width="8" height="84" rx="6" fill="#0891b2" stroke="#0891b2" stroke-width="1.5" opacity="1.0"/><text x="1034" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">BiLSTM 2 x 256</text><text x="1034" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Bidirectional -&gt; context features 512</text><line x1="1218" y1="284.0" x2="1222" y2="284.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="1222,276.0 1240,284.0 1222,292.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><rect x="1240" y="230" width="210" height="108" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" opacity="1.0"/><rect x="1252" y="242" width="8" height="84" rx="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.5" opacity="1.0"/><text x="1274" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Attention + Head</text><text x="1274" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Context 512 | FC 512 -&gt; 128 -&gt; 1</text><rect x="1240" y="420" width="220" height="108" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" opacity="1.0"/><rect x="1252" y="432" width="8" height="84" rx="6" fill="#ea580c" stroke="#ea580c" stroke-width="1.5" opacity="1.0"/><text x="1274" y="460" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Sigmoid + Output</text><text x="1274" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Healthy / Patients</text><line x1="1450" y1="284" x2="1450" y2="420" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="1.0"/><polygon points="1442,404 1450,420 1458,404" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5" opacity="1.0"/><text x="70" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Interpretation</text><text x="70" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">LayerMix enabled: yes | attention heads: 1</text><text x="70" y="664" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Classifier head: LayerNorm -&gt; Dropout(0.3) -&gt; Linear(512,128) -&gt; ReLU -&gt; Dropout(0.3) -&gt; Linear(128,1)</text><text x="70" y="692" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Training: epochs=30 | lr=0.001 | weight_decay=0.0001 | pos_weight=1.4</text><text x="70" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Source manifest: research/processed_data/manifests/hubert_sequences_all_layers.csv</text><rect x="1120" y="590" width="380" height="180" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="1.0"/><text x="1150" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Notes</text><text x="1150" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">T = variable number of HuBERT time frames.</text><text x="1150" y="688" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Each frame carries 768 embedding features.</text><text x="1150" y="714" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">BiLSTM output is concatenated across directions -&gt; 512.</text><text x="1150" y="740" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Sigmoid produces a single Patients probability before thresholding.</text></svg>