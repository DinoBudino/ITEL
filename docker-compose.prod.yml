services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: itel-audio-backend
    volumes:
      - ./data:/service/data:ro
    environment:
      ITEL_CORS_ORIGINS: http://localhost,http://127.0.0.1
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: itel-audio-frontend
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: itel-audio-proxy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
