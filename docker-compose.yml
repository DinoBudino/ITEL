services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: itel-audio-backend
    volumes:
      - ./data:/service/data:ro
    environment:
      ITEL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: itel-audio-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
