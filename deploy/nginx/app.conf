upstream itel_frontend {
  server frontend:80;
}

upstream itel_backend {
  server backend:8000;
}

limit_req_zone $binary_remote_addr zone=itel_api:10m rate=20r/m;

server {
  listen 80;
  server_name _;

  client_max_body_size 50M;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    limit_req zone=itel_api burst=5 nodelay;
    proxy_pass http://itel_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location / {
    proxy_pass http://itel_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
